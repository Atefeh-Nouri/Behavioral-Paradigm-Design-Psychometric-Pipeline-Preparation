name: Psychometric Pipeline Continuous Integration

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:

  # ─── Single source of truth for raw data ──────────────────────────────────
  generate-benchmark-data:
    name: Generate Benchmark Data (single source of truth)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-ci.txt

      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Generate raw benchmark data (single generation, pinned to Python 3.11)
        run: |
          mkdir -p data/raw
          python synthetic_data/generate_benchmark.py \
            --config config/config.yaml \
            --seed 2026

      - name: Print raw-data checksum (for parity audit trail)
        run: sha256sum data/raw/*.csv | sort | sha256sum

      - name: Upload raw benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-raw-data
          path: data/raw/
          retention-days: 1
          if-no-files-found: error

  # ─── Python pipeline consumes the SAME raw data ───────────────────────────
  python-test-suite:
    name: Python 3.11 Unit Tests & Pipeline Run
    needs: generate-benchmark-data
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-ci.txt

      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Download raw benchmark data
        uses: actions/download-artifact@v4
        with:
          name: benchmark-raw-data
          path: data/raw/

      - name: Verify Project Structure
        run: |
          ls -la
          ls -la config/
          ls -la paradigms/psychopy/
          ls -la tests/
          ls -la data/raw/

      - name: Execute Pytest Suite
        run: |
          pytest \
            tests/test_pipeline.py \
            tests/test_sdt.py \
            tests/test_config.py \
            tests/test_trial_generator.py \
            tests/test_logger_schema.py \
            -v --durations=10

      - name: Run Python Psychometric Processing Pipeline
        run: |
          mkdir -p data/processed/python
          python analysis_python/cpt_pipeline.py \
            --config config/pipeline_config.yaml

      - name: Upload Python Processed Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-processed-data
          path: data/processed/python/
          retention-days: 1
          if-no-files-found: error

  # ─── R pipeline consumes the SAME raw data (no regeneration) ──────────────
  r-pipeline-check:
    name: R 4.4 Tidyverse Pipeline Run & QA
    needs: generate-benchmark-data
    runs-on: ubuntu-24.04
    container:
      image: rocker/tidyverse:4.4.0
    steps:
      - uses: actions/checkout@v4

      - name: Download raw benchmark data
        uses: actions/download-artifact@v4
        with:
          name: benchmark-raw-data
          path: data/raw/

      - name: Install System Libraries for arrow
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git \
            libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Ensure Output Directory Exists
        run: mkdir -p data/processed/r

      - name: Install Required R Packages
        run: |
          Rscript -e "install.packages(c('yaml','arrow'), repos='https://cloud.r-project.org')"

      - name: Execute R Cleaning and Scoring Pipeline
        run: Rscript analysis_r/cpt_cleaning_pipeline.R

      - name: Upload R Processed Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: r-processed-data
          path: data/processed/r/
          retention-days: 1
          if-no-files-found: error

  # ─── Cross-language parity (unchanged) ────────────────────────────────────
  cross-language-equivalence:
    name: Cross-Language Numerical Parity Verification
    needs: [python-test-suite, r-pipeline-check]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-ci.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
      - uses: actions/download-artifact@v4
        with:
          name: python-processed-data
          path: data/processed/python/
      - uses: actions/download-artifact@v4
        with:
          name: r-processed-data
          path: data/processed/r/
      - name: Sanity Check Artifact Layout
        run: |
          set -euo pipefail
          test -f data/processed/python/cleaned_trials.parquet
          test -f data/processed/r/cleaned_trials_r.csv
      - name: Run Cross-Language Equivalence Audit
        run: |
          set -euo pipefail
          python tests/verify_equivalence.py \
            --py-output data/processed/python/cleaned_trials.parquet \
            --r-output  data/processed/r/cleaned_trials_r.csv \
            --config    config/pipeline_config.yaml \
            2>&1 | tee equivalence_report.txt
      - name: Upload Equivalence Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-language-equivalence-report
          path: equivalence_report.txt
          retention-days: 90
